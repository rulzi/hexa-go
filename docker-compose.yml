# Credentials are loaded from .env.docker (gitignored).
# Setup: cp .env.docker.example .env.docker
#
# Alternative: Docker secrets (Swarm-compatible)
#   mkdir -p secrets
#   openssl rand -base64 32 > secrets/db_password.txt
#   openssl rand -base64 48 > secrets/jwt_secret.txt
#   chmod 600 secrets/*
# Then uncomment the secrets block below and the secret mounts on `app`.

services:
  mysql:
    image: mysql:8.0
    container_name: hexa-mysql
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migration:/docker-entrypoint-initdb.d
    networks:
      - hexa-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hexa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hexa-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hexa-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env.docker
    # secrets:
    #   - db_password
    #   - jwt_secret
    volumes:
      - storage_data:/home/app/storage
    networks:
      - hexa-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

networks:
  hexa-network:
    driver: bridge

